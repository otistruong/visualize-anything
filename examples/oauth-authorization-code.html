<style>

    --blue: #6aa9ff; --green: #4ade80; --amber: #fbbf24; --purple: #b197fc; --pink: #f57fb8;
    --orange: #fb9a4b; --cyan: #33d6ec; --gray: #a3afbd; --red: #ff6b6b;

  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --panel: #171e27; --panel2: #1f2833; --fg: #e6ebf2; --muted: #9aa7b6;
  --line: #2d3846; --ground: #131a23; --wire: #5d6b7c;
  --blue: #6aa9ff; --green: #4ade80; --amber: #fbbf24; --purple: #b197fc; --pink: #f57fb8;
  --orange: #fb9a4b; --cyan: #33d6ec; --gray: #a3afbd; --red: #ff6b6b;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {

  grid-template-columns: minmax(0, 1fr) 390px;

}
.head { grid-area: head; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }

  border: 1px solid var(--c); color: var(--c); font-size: 11.5px; font-weight: 600; white-space: nowrap;
  background: color-mix(in srgb, var(--c) 12%, transparent);
}
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.stage { grid-area: stage; min-width: 0; }
.scene-wrap { overflow: auto; background: var(--ground); border-radius: 10px 10px 0 0; max-height: 62vh; }
.scene-wrap svg { display: block; margin: 0 auto; }
.caption {
  display: flex; gap: 8px; align-items: baseline; padding: 8px 12px; border-top: 1px solid var(--line);
  min-height: 38px;
}
.caption b { font-weight: 600; }
.caption .n { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.playbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; min-width: 32px;
  padding: 0 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); cursor: pointer;
}
.btn:hover:not(:disabled) { background: var(--panel2); }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, .row:focus-visible, .dot:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.btn.primary { background: var(--fg); color: var(--panel); border-color: var(--fg); min-width: 84px; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--fg); opacity: .88; }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 120px; align-items: center; padding: 0 6px; }
.dot {
  width: 10px; height: 10px; padding: 0; border-radius: 50%; border: 1.5px solid var(--wire); background: transparent; cursor: pointer;
}
.dot.past { background: var(--c); border-color: var(--c); opacity: .55; }
.dot.cur { background: var(--c); border-color: var(--c); transform: scale(1.35); }
.dot.fail { border-color: var(--red); }
.dot.fail.past, .dot.fail.cur { background: var(--red); }
.speeds { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.speeds button { border: 0; background: var(--panel); height: 30px; padding: 0 7px; cursor: pointer; font-size: 12px; }
.speeds button.on { background: var(--fg); color: var(--panel); }
.hint { color: var(--muted); font-size: 11.5px; padding: 0 12px 8px; }
kbd {
  font: 11px ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 4px; padding: 0 4px; background: var(--panel2);
}

/* scene */
.zone { fill: color-mix(in srgb, var(--c) 9%, transparent); stroke: var(--c); stroke-width: 1.2; stroke-dasharray: 6 4; }
.zone-label { fill: var(--c); font-size: 11.5px; font-weight: 600; letter-spacing: .02em; }
.link { stroke: var(--wire); stroke-width: 1.6; stroke-dasharray: 5 5; fill: none; }
.path { stroke: var(--c); stroke-width: 3; fill: none; stroke-linecap: round; }
.path.adhoc { stroke-dasharray: 7 6; stroke-width: 2.2; }
.actor { --c: var(--wire); }
.actor .f { stroke: var(--c); stroke-width: 1.4; stroke-linejoin: round; }
.actor .f.top { fill: color-mix(in srgb, var(--c) 22%, var(--panel)); }
.actor .f.front { fill: color-mix(in srgb, var(--c) 12%, var(--panel)); }
.actor .f.side { fill: color-mix(in srgb, var(--c) 36%, var(--panel)); }
.actor .d { stroke: var(--c); stroke-width: 1.2; fill: none; opacity: .75; }
.actor .shadow { fill: #000; opacity: .08; }
.actor.on .f { stroke-width: 2.2; }
.actor.on .f.top { fill: color-mix(in srgb, var(--c) 42%, var(--panel)); }
.actor.on .f.front { fill: color-mix(in srgb, var(--c) 26%, var(--panel)); }
.actor.on .f.side { fill: color-mix(in srgb, var(--c) 58%, var(--panel)); }
.alabel text { text-anchor: middle; }
.alabel .name, .alabel .sub, .zone-label { paint-order: stroke; stroke: var(--ground); stroke-width: 4px; stroke-linejoin: round; }
.alabel .name { fill: var(--fg); font-size: 12.5px; font-weight: 600; }
.alabel .sub { fill: var(--muted); font-size: 10.5px; font-family: ui-monospace, Menlo, Consolas, monospace; }
.alabel .st-bg { fill: var(--panel); stroke: var(--wire); stroke-width: 1; }
.alabel .st { fill: var(--fg); font-size: 10.5px; font-weight: 600; font-family: ui-monospace, Menlo, Consolas, monospace; }
.alabel.flash .st-bg { fill: var(--changed-bg); stroke: var(--changed-fg); }
.alabel.flash .st { fill: var(--changed-fg); }
.token .body { fill: var(--c); stroke: var(--panel); stroke-width: 1.5; filter: drop-shadow(0 0 5px var(--c)); }
.token .cross { stroke: #fff; stroke-width: 2.4; stroke-linecap: round; display: none; }
.token .pill-bg { fill: var(--panel); stroke: var(--c); stroke-width: 1.3; }
.token .pill { fill: var(--c); font-size: 11.5px; font-weight: 600; text-anchor: middle; }
.token.failed { --c: var(--red) !important; }
.token.failed .cross { display: block; }
.ring { fill: none; stroke: var(--c); stroke-width: 2; }

/* timeline */
.seq { grid-area: seq; min-width: 0; overflow: hidden; }
.seq h2, .insp h3, .about h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0; font-weight: 600; }
.seq > h2 { padding: 10px 12px 6px; }
.seq-scroll { overflow: auto; max-height: 420px; }
.seq-inner { position: relative; }
.seq-head { position: sticky; top: 0; z-index: 2; display: flex; background: var(--panel); border-bottom: 1px solid var(--line); }
.seq-head div { flex: 1 1 0; min-width: 0; text-align: center; padding: 5px 4px; font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seq-rows { position: relative; }
.life { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed var(--line); }
.row {
  position: relative; display: block; width: 100%; height: 44px; border: 0; background: transparent; cursor: pointer;
  padding: 0; text-align: left; overflow: hidden; opacity: .45;
}
.row.past { opacity: .75; }
.row.cur { opacity: 1; background: color-mix(in srgb, var(--c) 10%, transparent); }
.row:hover { opacity: 1; }
.row .num { position: absolute; left: 6px; top: 13px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.arrow { position: absolute; top: 28px; height: 0; border-top: 2px solid var(--c); }
.row.cur .arrow { border-top-width: 3px; }
.arrow::after {
  content: ""; position: absolute; top: -6px; border: 5px solid transparent;
}
.arrow.r::after { right: -1px; border-left: 8px solid var(--c); border-right: 0; }
.arrow.l::after { left: -1px; border-right: 8px solid var(--c); border-left: 0; }
.arrow .lab, .self .lab {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 4px; white-space: nowrap;
  font-size: 11.5px; font-weight: 600; color: var(--c);
}
.row.fail { --c: var(--red) !important; }
.row.fail .arrow { border-top-style: dashed; }
.row.fail .arrow::after { border: 0; content: "\2715"; color: var(--red); font-weight: 700; font-size: 13px; top: -11px; }
.row.fail .arrow.r::after { right: -12px; }
.row.fail .arrow.l::after { left: -12px; }
.self {
  position: absolute; top: 10px; height: 24px; border: 1.3px dashed var(--c);
  border-radius: 6px; background: var(--panel); padding: 0 8px; max-width: calc(100% - 34px);
}
.self .lab { position: static; transform: none; display: block; line-height: 21px; overflow: hidden; text-overflow: ellipsis; }
.row.fail .self { border-style: solid; }
.row.fail .self .lab::before { content: "\2715  "; }

/* inspector */
.insp { grid-area: insp; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; padding: 14px; }
.insp-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.insp h2 { font-size: 17px; line-height: 1.3; margin: 8px 0 4px; }
.route { color: var(--muted); font-size: 12.5px; }

.failbox {

.desc { margin: 10px 0 0; }
.insp section { margin-top: 16px; }

.group { border-left: 3px solid var(--c); padding-left: 10px; margin-bottom: 10px; }
.group-name { color: var(--c); font-weight: 600; font-size: 12.5px; margin-bottom: 2px; }
.field { display: grid; grid-template-columns: minmax(90px, 38%) 1fr; column-gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--line); }

.field .note { grid-column: 1 / -1; color: var(--muted); font-size: 12px; padding-bottom: 2px; }
.field.changed { background: var(--changed-bg); margin: 0 -6px; padding: 3px 6px; border-radius: 4px; border-bottom-color: transparent; }
.field.changed .k, .field.changed .v, .field.changed .note { color: var(--changed-fg); }
.tag {

pre.payload {
  margin: 0; padding: 9px 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
  font-size: 12px; line-height: 1.45; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
}
.tbl-wrap { overflow-x: auto; margin-bottom: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
caption { text-align: left; font-weight: 600; padding-bottom: 3px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11.5px; border-bottom: 1px solid var(--line); padding: 3px 8px 3px 0; }
td { border-bottom: 1px solid var(--line); padding: 3px 8px 3px 0; vertical-align: top; font-family: ui-monospace, Menlo, Consolas, monospace; overflow-wrap: break-word; }
th { white-space: nowrap; }
td.changed { background: var(--changed-bg); color: var(--changed-fg); }
tr.mark td:first-child { box-shadow: inset 3px 0 0 var(--c); padding-left: 8px; font-weight: 600; }
.tbl-key { color: var(--muted); font-size: 11.5px; margin: -4px 0 0; }
.tbl-key i { display: inline-block; width: 10px; height: 10px; background: var(--changed-bg); border: 1px solid var(--changed-fg); vertical-align: -1px; margin-right: 4px; }
ul.notes { margin: 0; padding-left: 18px; }
ul.notes li { margin-bottom: 4px; }

/* about */
.about { grid-area: about; padding: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.about ul { margin: 6px 0 0; padding-left: 18px; }
.about li { margin-bottom: 4px; overflow-wrap: anywhere; }
.about a { color: var(--blue); }
.foot { grid-column: 1 / -1; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.error { grid-column: 1 / -1; padding: 16px; border: 1px solid var(--red); border-radius: 10px; white-space: pre-wrap; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "stage" "insp" "seq" "about"; padding: 10px; gap: 10px; }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

eck when the browser comes back."],["code_challenge","E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM","SHA-256 of the code_verifier, base64url encoded. The verifier itself stays on the client."],["code_challenge_method","S256"]]}],"status":{"browser":"on auth.example.com"}},{"from":"authz","kind":"check","label":"known client + redirect?","title":"The authorization server checks the client and redirect URI","desc":"Before showing anything, the server looks up client_id and compares redirect_uri with the one registered for that client. Both match, so the request continues.","state":[{"title":"Authorization server: registered clients","head":["client_id","Registered redirect URI","Result"],"rows":[["s6BhdRkqt3","https://client.example.com/cb","exact match"]],"mark":[0]}],"notes":["If the redirect URI does not match, the server must not redirect the browser to it. It shows the user an error page instead, so a code can never be sent to an address an attacker supplied."]},{"from":"authz","to":"browser","kind":"front","label":"login + consent page","title":"The server asks the user to sign in and approve","desc":"The authorization server shows its own sign-in page, then a consent screen: \"Client app wants to read your calendar\".","notes":["How the user signs in (password, passkey, an existing session) is up to the authorization server. OAuth does not define it."]},{"from":"browser","to":"authz","kind":"front","label":"sign in + approve","title":"The user signs in and approves the request","desc":"The user's credentials go to the authorization server only. The client app never sees them. This is the point of the whole flow.","status":{"browser":"approved calendar.read"}},{"from":"authz","kind":"check","label":"issue one-time code","title":"The server issues a short-lived authorization code","desc":"The server creates a code and records what it is bound to: the client, the redirect URI and the code_challenge from the request. The code is not a token. It is a one-time voucher  with its own credentials and sends the code together with the code_verifier it kept secret.","fields":[{"group":"Form body","rows":[["grant_type","authorization_code"],["code","SplxlOBeZQQYbYS6WxSbIA"],["redirect_uri","https://client.example.com/cb","Must equal the one used in the authorization request."],["code_verifier","dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk","Sent for the first time here. It never went through the browser."]]}],"payload":"POST /token HTTP/1.1\nHost: auth.example.com\nAuthorization: Basic czZCaGRSa3F0MzpnWDFmQmF0M2JW\nContent-Type: application/x-www-form-urlencoded\n\ngrant_type=authorization_code\n&code=SplxlOBeZQQYbYS6WxSbIA\n&redirect_uri=https%3A%2F%2Fclient.example.com%2Fcb\n&code_verifier=dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk","notes":["The Authorization header is the client_id and client secret (HTTP Basic). An app that cannot keep a secret, such as a mobile or single-page app, sends client_id only and relies on PKCE."]},{"from":"authz","kind":"check","label":"verify code + PKCE","title":"The server verifies everything the code was bound to","desc":"Every check must pass. The last one is PKCE: the server hashes the code_verifier it just received and compares the result with the code_challenge it stored. Then it marks the code as used.","state":[{"title":"Token request checks","head":["Check","Result"],"rows":[["Client credentials are valid","pass"],["Code exists, not expired, not used","pass"],["Code was issued to this client","pass"],["redirect_uri equals the original","pass"],["BASE64URL(SHA-256(verifier)) = challenge","pass"]]},{"title":"Authorization server: issued codes","head":["Code","Issued to","Bound to","Expires","Used"],"rows":[["SplxlOBeZQQYbYS6WxSbIA","s6BhdRkqt3","redirect_uri + code_challenge","in 60 s","yes"]]}]},{"from":"authz","to":"client","kind":"back","label":"200 access token","title":"The server returns an access token","desc":"The response is JSON and must not be cached. The access token is what the client will present to the API. The refresh token lets it get a new access token later without involving the user.","payload":"HTTP/1.1 200 OK\nContent-Type: application/json\nCache-Control: no-store\n\n{\n  \"access_token\": \"2YotnFZFEjr1zCsicMWpAA\",\n  \"token_type\": \"Bearer\",\n  \"expires_in\": 3600,\n  \"refresh_token\": \"tGzv3JOkF0XG5Qx2TlKWIA\",\n  \"scope\": \"calendar.read\"\n}","status":{"client":"has access token"}},{"from":"client","to":"api","kind":"api","label":"GET /events + Bearer token","title":"The client calls the API with the token","desc":"The access token goes in the Authorization header. \"Bearer\" means whoever holds the token can use it, which is why it is only ever sent over TLS and never through the browser's address bar.","payload":"GET /events HTTP/1.1\nHost: api.example.com\nAuthorization: Bearer 2YotnFZFEjr1zCsicMWpAA"},{"from":"api","kind":"check","label":"token valid for this?","title":"The resource server validates the token","desc":"The API checks that the token is genuine, has not expired and covers this request (scope calendar.read). It passes.","notes":["OAuth 2.0 does not say how the API validates a token. Two common ways: the token is a signed JWT the API can verify itself (RFC 9068), or the API asks the authorization server (token introspection, RFC 7662).","A missing, expired or invalid token gets 401 with a WWW-Authenticate: Bearer header. A valid token without the needed scope gets 403 insufficient_scope."]},{"from":"api","to":"client","kind":"api","label":"200 calendar events","title":"The API returns the user's calendar","desc":"The client has the data it asked for. At no point did it handle the user's password, and its access is limited to the scope the user approved.","status":{"client":"showing calendar"}},{"from":"attacker","to":"authz","kind":"back","label":"POST /token copied code","title":"What if: someone replays a copied code","desc":"Suppose an attacker copied the code from the redirect URL (from browser history, a log file or a malicious app on the device) and sends it to the token endpoint. They have the code, but not the code_verifier.","fields":[{"group":"Form body","rows":[["grant_type","authorization_code"],["code","SplxlOBeZQQYbYS6WxSbIA"],["redirect_uri","https://client.example.com/cb"],["code_verifier","(a guess, or missing)","The real one never left the client app."]],"changed":["code_verifier"]}]},{"from":"authz","kind":"check","label":"refuse: reused, no verifier","title":"The server refuses the code","desc":"Two independent checks fail. The code has already been used, and the verifier does not hash to the stored challenge. Either one is enough to refuse.","fail":"An authorization code works once, and only together with the code_verifier that matches its code_challenge. The attacker has neither a fresh code nor the verifier.","state":[{"title":"Token request checks","head":["Check","Result"],"rows":[["Client credentials are valid","FAIL: none supplied"],["Code exists, not expired, not used","FAIL: already used"],["Code was issued to this client","not reached"],["redirect_uri equals the original","not reached"],["BASE64URL(SHA-256(verifier)) = challenge","FAIL: no match"]]}],"notes":["When a code is presented a second time, the server should also revoke the tokens it issued from that code, because it cannot tell which caller was the genuine one."]},{"from":"authz","to":"attacker","kind":"back","label":"400 invalid_grant","title":"The attacker gets an error, not a token","desc":"The token endpoint answers 400 Bad Request with the error code invalid_grant. No token is issued.","payload":"HTTP/1.1 400 Bad Request\nContent-Type: application/json\nCache-Control: no-store\n\n{\n  \"error\": \"invalid_grant\"\n}","status":{"attacker":"no token"}}],"simplifications":["TLS is assumed everywhere and not drawn. Every arrow here is an HTTPS request or response.","The login and consent exchange is two steps. Real sign-in is several requests and may include multi-factor authentication.","The client is a confidential web app with a client secret. Public clients (mobile and single-page apps) send no secret and depend on PKCE alone.","Refresh token use and rotation, token revocation and expiry handling are left out.","How the resource server validates the access token is summarised in one step; it differs between providers.","OpenID Connect (ID tokens, nonce, user info) is a layer on top of this flow and is not shown.","In the replay case the three failed checks are shown together; a real server stops at the first one that fails.","Token values are the short examples from the RFCs. Real tokens are longer."],"sources":[{"title":"RFC 6749: The OAuth 2.0 Authorization Framework, sections 4.1, 5.1, 5.2 and 10.12","url":"https://www.rfc-editor.org/rfc/rfc6749","note":"The authorization code grant, token responses, the invalid_grant error, single use of codes and the state parameter. Example values (client_id, code, tokens) are taken from here."},{"title":"RFC 7636: Proof Key for Code Exchange (PKCE)","url":"https://www.rfc-editor.org/rfc/rfc7636","note":"code_verifier, code_challenge and the S256 method. The verifier and challenge are the test vector in Appendix B."},{"title":"RFC 6750: Bearer Token Usage","url":"https://www.rfc-editor.org/rfc/rfc6750","note":"The Authorization: Bearer header and the 401 / 403 error responses."},{"title":"RFC 9700: Best Current Practice for OAuth 2.0 Security","url":"https://www.rfc-editor.org/rfc/rfc9700","note":"Exact redirect URI matching and PKCE as current practice."},{"title":"RFC 7662 (token introspection) and RFC 9068 (JWT access tokens)","url":"https://www.rfc-editor.org/rfc/rfc9068","note":"The two common ways a resource server validates a token."}]}

<script>
(() => {
'use strict';

/* ---------- small helpers ---------- */
const $ = (id) => document.getElementById(id);
const SVG = 'http://www.w3.org/2000/svg';
const svg = (name, attrs, parent) => {
  const n = document.createElementNS(SVG, name);
  for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};
const h = (name, cls, text, parent) => {
  const n = document.createElement(name);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  if (parent) parent.appendChild(n);
  return n;
};
const COLORS = ['blue', 'green', 'amber', 'purple', 'pink', 'orange', 'cyan', 'gray'];
const cvar = (name) => `var(--${COLORS.includes(name) ? name : 'gray'})`;

let spec;
try {
  spec = JSON.parse($('spec').textContent);
  if (!spec || !Array.isArray(spec.actors) || !Array.isArray(spec.steps) || !spec.steps.length) throw new Error('The spec needs "actors" and at least one entry in "steps".');
} catch (e) {
  const app = $('app');
  app.textContent = '';
  h('div', 'error', 'This file does not contain a valid spec.\n' + e.message + '\nRun scripts/validate.mjs on the spec to see what is wrong.', app);
  return;
}

const actors = spec.actors;
const steps = spec.steps;
const byId = Object.fromEntries(actors.map((a) => [a.id, a]));
const kinds = spec.kinds || {};
const kindOf = (s) => kinds[s.kind] || { label: s.kind || 'Step', color: 'gray' };
const colorOf = (s) => (s.fail ? 'var(--red)' : cvar(kindOf(s).color));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- scene geometry (keep in sync with scripts/validate.mjs) ---------- */
const U = 64, SKEW = 0.38, DEPTH = 0.56;
const P = (x, y, z = 0) => [U * (x - SKEW * y), U * (DEPTH * y - z)];
const SHAPES = {
  box: { w: 1.25, d: 1.0, h: 0.75 },
  tower: { w: 0.95, d: 0.9, h: 1.25 },
  tile: { w: 1.45, d: 1.05, h: 0.2 },
  cylinder: { w: 1.15, d: 1.0, h: 0.9 },
  person: { w: 0.7, d: 0.6, h: 1.25 },
  cloud: { w: 1.7, d: 1.0, h: 0.95 },
  screen: { w: 1.3, d: 0.95, h: 0.95 },
  page: { w: 0.95, d: 0.3, h: 1.15 },
};
const shapeOf = (a) => SHAPES[a.shape] || SHAPES.box;
const pts = (list) => list.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');

function prism(g, x, y, w, d, ht, z0 = 0) {
  const x0 = x - w / 2, x1 = x + w / 2, y0 = y - d / 2, y1 = y + d / 2, z1 = z0 + ht;
  svg('polygon', { class: 'f side', points: pts([P(x1, y1, z0), P(x1, y0, z0), P(x1, y0, z1), P(x1, y1, z1)]) }, g);
  svg('polygon', { class: 'f top', points: pts([P(x0, y1, z1), P(x1, y1, z1), P(x1, y0, z1), P(x0, y0, z1)]) }, g);
  svg('polygon', { class: 'f front', points: pts([P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)]) }, g);
}
function frontLine(g, x, y, w, d, z, inset = 0.15) {
  const a = P(x - w / 2 + inset, y + d / 2, z), b = P(x + w / 2 - inset, y + d / 2, z);
  svg('line', { class: 'd', x1: a[0], y1: a[1], x2: b[0], y2: b[1] }, g);
}
function drawShape(g, a) {
  const s = shapeOf(a), [x, y] = a.pos, kind = SHAPES[a.shape] ? a.shape : 'box';
  const base = P(x, y, 0), rx = (s.w / 2) * U, ry = rx * 0.4;
  svg('ellipse', { class: 'shadow', cx: base[0] + 4, cy: base[1] + 5, rx: rx * 1.15, ry: ry * 1.1 }, g);
  if (kind === 'box') {
    prism(g, x, y, s.w, s.d, s.h);
  } else if (kind === 'tower') {
    prism(g, x, y, s.w, s.d, s.h);
    for (const z of [0.95, 0.7, 0.45]) frontLine(g, x, y, s.w, s.d, z);
  } else if (kind === 'tile') {
    prism(g, x, y, s.w, s.d, s.h);
  } else if (kind === 'screen') {
    prism(g, x, y + 0.12, s.w, 0.7, 0.1);
    prism(g, x, y - 0.3, s.w, 0.1, s.h - 0.1, 0.1);
    frontLine(g, x, y - 0.3, s.w, 0.1, 0.72, 0.22);
    frontLine(g, x, y - 0.3, s.w, 0.1, 0.52, 0.22);
  } else if (kind === 'page') {
    prism(g, x, y, s.w, s.d, s.h);
    for (const z of [0.9, 0.7, 0.5, 0.3]) frontLine(g, x, y, s.w, s.d, z, 0.18);
  } else if (kind === 'cylinder') {
    const top = P(x, y, s.h);
    svg('path', { class: 'f front', d: `M${base[0] - rx},${top[1]} V${base[1]} A${rx},${ry} 0 0 0 ${base[0] + rx},${base[1]} V${top[1]} Z` }, g);
    svg('ellipse', { class: 'f top', cx: top[0], cy: top[1], rx, ry }, g);
    const mid = P(x, y, s.h * 0.5);
    svg('path', { class: 'd', d: `M${mid[0] - rx},${mid[1]} A${rx},${ry} 0 0 0 ${mid[0] + rx},${mid[1]}` }, g);
  } else if (kind === 'person') {
    const sh = P(x, y, 0.75), head = P(x, y, 1.02);
    svg('path', { class: 'f front', d: `M${base[0] - rx},${base[1]} L${sh[0] - rx * 0.75},${sh[1]} A${rx * 0.75},${rx * 0.6} 0 0 1 ${sh[0] + rx * 0.75},${sh[1]} L${base[0] + rx},${base[1]} A${rx},${ry} 0 0 1 ${base[0] - rx},${base[1]} Z` }, g);
    svg('circle', { class: 'f top', cx: head[0], cy: head[1], r: 0.23 * U }, g);
  } else if (kind === 'cloud') {
    const c = P(x, y, 0.42), k = U / 64;
    svg('path', {
      class: 'f top',
      transform: `translate(${c[0]},${c[1]}) scale(${k})`,
      d: 'M-38,22 a19,19 0 0 1 -4,-37 a25,25 0 0 1 45,-11 a21,21 0 0 1 36,18 a15.5,15.5 0 0 1 -5,30 z',
    }, g);
  }
}
/** point a token rests at above an actor, and where its label starts below it */
const topOf = (a) => { const p = P(a.pos[0], a.pos[1], shapeOf(a).h); return [p[0], p[1] - 24]; };
const labelAt = (a) => { const p = P(a.pos[0], a.pos[1] + shapeOf(a).d / 2, 0); return [p[0], p[1] + 17]; };
const labelWidth = (a) => Math.max((a.label || '').length * 7.3, (a.sub || '').length * 6.5, 30);

/* ---------- build the scene ---------- */
const wrap = $('sceneWrap');
const root = svg('svg', { role: 'img', 'aria-label': 'Scene: ' + actors.map((a) => a.label).join(', ') }, wrap);
const gZones = svg('g', {}, root), gLinks = svg('g', {}, root), gPath = svg('g', {}, root);
const gActors = svg('g', {}, root), gLabels = svg('g', {}, root), gToken = svg('g', {}, root);

let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
const grow = (x, y) => { bx0 = Math.min(bx0, x); by0 = Math.min(by0, y); bx1 = Math.max(bx1, x); by1 = Math.max(by1, y); };

for (const z of spec.zones || []) {
  const c = [P(z.x, z.y), P(z.x + z.w, z.y), P(z.x + z.w, z.y + z.h), P(z.x, z.y + z.h)];
  c.forEach((p) => grow(p[0], p[1]));
  const g = svg('g', { style: '--c:' + cvar(z.color) }, gZones);
  svg('polygon', { class: 'zone', points: pts(c) }, g);
  // the label hangs just outside the front edge, where nothing inside the zone can cover it
  const t = svg('text', { class: 'zone-label', x: c[3][0] + 4, y: c[3][1] + 16 }, g);
  t.textContent = z.label;
  grow(c[3][0] + 4 + (z.label || '').length * 6.8, c[3][1] + 22);
}
const linkKey = (a, b) => (a < b ? a + '|' + b : b + '|' + a);
const linkSet = new Set();
for (const [a, b] of spec.links || []) {
  if (!byId[a] || !byId[b]) continue;
  linkSet.add(linkKey(a, b));
  const p = P(...byId[a].pos), q = P(...byId[b].pos);
  svg('line', { class: 'link', x1: p[0], y1: p[1], x2: q[0], y2: q[1] }, gLinks);
}
const actorEl = {}, labelEl = {};
for (const a of [...actors].sort((m, n) => m.pos[1] - n.pos[1] || m.pos[0] - n.pos[0])) {
  const g = svg('g', { class: 'actor' }, gActors);
  drawShape(g, a);
  actorEl[a.id] = g;
  const [lx, ly] = labelAt(a), lw = labelWidth(a) / 2 + 6, s = shapeOf(a);
  const lg = svg('g', { class: 'alabel' }, gLabels);
  svg('text', { class: 'name', x: lx, y: ly }, lg).textContent = a.label;
  let y = ly;
  if (a.sub) { y += 14; svg('text', { class: 'sub', x: lx, y }, lg).textContent = a.sub; }
  const bg = svg('rect', { class: 'st-bg', rx: 8, height: 16, y: y + 6 }, lg);
  const st = svg('text', { class: 'st', x: lx, y: y + 18 }, lg);
  labelEl[a.id] = { g: lg, bg, st, x: lx };
  const top = P(a.pos[0], a.pos[1] - s.d / 2, s.h);
  grow(lx - lw, top[1] - 70); grow(lx + lw, y + 30);
  grow(P(a.pos[0] + s.w / 2, a.pos[1] - s.d / 2)[0] + 8, top[1]);
  grow(P(a.pos[0] - s.w / 2, a.pos[1] + s.d / 2)[0] - 8, top[1]);
}
const PADX = 44, PADY = 14;
bx0 -= PADX; bx1 += PADX; by0 -= PADY; by1 += PADY;
const BW = bx1 - bx0, BH = by1 - by0;
root.setAttribute('viewBox', `${bx0.toFixed(0)} ${by0.toFixed(0)} ${BW.toFixed(0)} ${BH.toFixed(0)}`);

let scale = 1;
const MIN_SCALE = 0.8;
function fit() {
  const w = wrap.clientWidth;
  const maxH = Math.max(260, Math.min(window.innerHeight * 0.56, 560));
  scale = Math.min(w / BW, maxH / BH, 1.3);
  if (scale < MIN_SCALE) scale = MIN_SCALE; // never shrink the labels below a readable size; the box scrolls instead
  root.style.width = (BW * scale).toFixed(0) + 'px';
  root.style.height = (BH * scale).toFixed(0) + 'px';
  layoutTimeline();
  paintToken();
}
/** When the scene is larger than its box (a phone), keep the token in the middle: the view follows the action. */
function follow(x, y) {
  if (wrap.scrollWidth > wrap.clientWidth + 1) wrap.scrollLeft = (x - bx0) * scale - wrap.clientWidth / 2;
  if (wrap.scrollHeight > wrap.clientHeight + 1) wrap.scrollTop = (y - by0) * scale - wrap.clientHeight / 2;
}

/* ---------- token ---------- */
const tok = svg('g', { class: 'token' }, gToken);
const ring = svg('ellipse', { class: 'ring', rx: 0, ry: 0 }, tok);
const tokMove = svg('g', {}, tok);
const tokBody = svg('g', {}, tokMove);
const tokRect = svg('rect', { class: 'body', x: -11, y: -8, width: 22, height: 16, rx: 4 }, tokBody);
const tokDia = svg('polygon', { class: 'body', points: '0,-11 11,0 0,11 -11,0' }, tokBody);
svg('line', { class: 'cross', x1: -4, y1: -4, x2: 4, y2: 4 }, tokBody);
svg('line', { class: 'cross', x1: 4, y1: -4, x2: -4, y2: 4 }, tokBody);
const pillBg = svg('rect', { class: 'pill-bg', height: 20, y: -39, rx: 10 }, tokMove);
const pill = svg('text', { class: 'pill', y: -25 }, tokMove);

/* ---------- playback state ---------- */
const SPEEDS = [0.5, 1, 2, 3];
let cur = 0, t = 0, arrived = false, playing = false, speed = 1, raf = 0, timer = 0, last = 0;
const N = steps.length;

function statusAt(i, incl) {
  const out = {};
  for (let k = 0; k <= i; k++) {
    if (k === i && !incl) break;
    Object.assign(out, steps[k].status || {});
  }
  return out;
}
function paintStatus() {
  const now = statusAt(cur, arrived), fresh = arrived ? steps[cur].status || {} : {};
  for (const a of actors) {
    const L = labelEl[a.id], v = now[a.id];
    L.st.textContent = v || '';
    L.bg.style.display = v ? '' : 'none';
    if (v) {
      const w = Math.max(v.length * 6.5 + 16, 30);
      L.bg.setAttribute('x', L.x - w / 2); L.bg.setAttribute('width', w);
    }
    L.g.classList.toggle('flash', a.id in fresh);
  }
}
function paintActors() {
  const s = steps[cur];
  for (const a of actors) {
    const on = s.to ? (arrived ? (s.fail ? false : a.id === s.to) : a.id === s.from) : a.id === s.from;
    const g = actorEl[a.id];
    g.classList.toggle('on', on);
    g.style.setProperty('--c', on ? colorOf(s) : a.color ? cvar(a.color) : 'var(--wire)');
  }
}
const ease = (e) => (e < 0.5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2);
function paintToken() {
  const s = steps[cur], a = topOf(byId[s.from]);
  let x, y, failed = false, rot = 0, sc = 1;
  if (!s.to) {
    x = a[0]; y = a[1] - Math.sin(t * Math.PI * 3) * 5 * (1 - t);
    rot = t * 180; sc = 0.75 + 0.25 * Math.sin(Math.min(t * 1.4, 1) * Math.PI / 2);
    failed = !!s.fail && t >= 0.6;
    const base = P(...byId[s.from].pos), r = shapeOf(byId[s.from]).w * U * (0.6 + t * 0.5);
    ring.setAttribute('cx', base[0]); ring.setAttribute('cy', base[1]);
    ring.setAttribute('rx', r); ring.setAttribute('ry', r * 0.42);
    ring.style.opacity = t >= 1 ? 0 : (1 - t) * 0.9;
  } else {
    ring.style.opacity = 0;
    const b = topOf(byId[s.to]), stop = s.fail ? 0.56 : 1;
    const e = Math.min(t / 0.82, 1), p = ease(e) * stop;
    const dist = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const fall = s.fail && t > 0.82 ? (t - 0.82) / 0.18 : 0;
    x = a[0] + (b[0] - a[0]) * p;
    y = a[1] + (b[1] - a[1]) * p - Math.sin(p * Math.PI) * Math.min(34, dist * 0.14) + fall * 20;
    failed = !!s.fail && e >= 1;
  }
  tok.classList.toggle('failed', failed);
  tokMove.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`);
  tokBody.setAttribute('transform', `rotate(${rot.toFixed(0)}) scale(${sc.toFixed(2)})`);
  follow(x, y + 30);
}
function frame(now) {
  const s = steps[cur], dur = (s.to ? 1250 : 850) / speed;
  t = Math.min(1, t + Math.min(now - last, 50) / dur);
  last = now;
  paintToken();
  if (t >= 1) return arrive();
  raf = requestAnimationFrame(frame);
}
function arrive() {
  t = 1; arrived = true;
  paintToken(); paintActors(); paintStatus();
  if (playing) {
    timer = setTimeout(() => {
      if (!playing) return;
      if (cur >= N - 1) { playing = false; paintControls(); } else go(cur + 1);
    }, 1300 / speed);
  }
}
function go(i, opts = {}) {
  cancelAnimationFrame(raf); clearTimeout(timer);
  cur = Math.max(0, Math.min(N - 1, i));
  t = 0; arrived = false;
  const s = steps[cur];
  tok.style.setProperty('--c', cvar(kindOf(s).color));
  tokRect.style.display = s.to ? '' : 'none';
  tokDia.style.display = s.to ? 'none' : '';
  pill.textContent = s.label;
  const w = Math.max(pill.getComputedTextLength ? pill.getComputedTextLength() : 0, s.label.length * 6.2) + 18;
  pillBg.setAttribute('x', -w / 2); pillBg.setAttribute('width', w);
  // highlight the path this hop takes
  gPath.textContent = '';
  if (s.to) {
    const p = P(...byId[s.from].pos), q = P(...byId[s.to].pos);
    const end = s.fail ? [p[0] + (q[0] - p[0]) * 0.56, p[1] + (q[1] - p[1]) * 0.56] : q;
    svg('line', {
      class: 'path' + (linkSet.has(linkKey(s.from, s.to)) ? '' : ' adhoc'), style: '--c:' + colorOf(s),
      x1: p[0], y1: p[1], x2: end[0], y2: end[1],
    }, gPath);
  }
  paintActors(); paintStatus(); paintInspector(); paintTimeline(); paintControls();
  if (!opts.silent) history.replaceState(null, '', '#step=' + (cur + 1));
  if (reduced || opts.instant) return arrive();
  paintToken();
  last = performance.now();
  raf = requestAnimationFrame(frame);
}
function toggle() {
  if (playing) { playing = false; clearTimeout(timer); paintControls(); return; }
  playing = true;
  paintControls();
  if (cur >= N - 1 && arrived) go(0);
  else if (arrived) go(cur + 1); // otherwise the hop in flight finishes and playback carries on from there
}

/* ---------- header, legend, controls ---------- */
document.title = spec.title || 'Visual explainer';
$('title').textContent = spec.title || '';
$('summary').textContent = spec.summary || '';
const usedKinds = [...new Set(steps.map((s) => s.kind))];
for (const k of usedKinds) {
  const c = h('span', 'chip', (kinds[k] || { label: k }).label, $('legend'));
  c.style.setProperty('--c', cvar((kinds[k] || {}).color));
}
if (steps.some((s) => s.fail)) h('span', 'chip', '✕ Fails or is refused', $('legend')).style.setProperty('--c', 'var(--red)');

const dots = steps.map((s, i) => {
  const d = h('button', 'dot' + (s.fail ? ' fail' : ''), null, $('dots'));
  d.type = 'button'; d.title = `${i + 1}. ${s.title}`; d.setAttribute('aria-label', `Go to step ${i + 1}: ${s.title}`);
  d.style.setProperty('--c', colorOf(s));
  d.onclick = () => go(i);
  return d;
});
const speedBtns = SPEEDS.map((v) => {
  const b = h('button', '', v + '×', $('speeds'));
  b.type = 'button'; b.setAttribute('aria-label', `Speed ${v}x`);
  b.onclick = () => { speed = v; paintControls(); };
  return b;
});
const ICON_PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2v12l9-6z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>';
function paintControls() {
  const s = steps[cur], k = kindOf(s);
  $('play').innerHTML = (playing ? ICON_PAUSE : ICON_PLAY) + '<span></span>';
  $('play').lastChild.textContent = playing ? 'Pause' : cur >= N - 1 && arrived ? 'Replay' : 'Play';
  $('prev').disabled = $('first').disabled = cur === 0;
  $('next').disabled = cur === N - 1;
  dots.forEach((d, i) => { d.classList.toggle('cur', i === cur); d.classList.toggle('past', i < cur); });
  speedBtns.forEach((b, i) => { b.classList.toggle('on', SPEEDS[i] === speed); b.setAttribute('aria-pressed', SPEEDS[i] === speed); });
  $('capN').textContent = `${cur + 1} / ${N}`;
  $('capKind').textContent = s.fail ? '✕ ' + k.label : k.label;
  $('capKind').style.setProperty('--c', colorOf(s));
  $('capTitle').textContent = s.title;
}
$('first').onclick = () => go(0);
$('prev').onclick = () => go(cur - 1);
$('next').onclick = () => go(cur + 1);
$('play').onclick = toggle;
$('theme').onclick = flipTheme;
function flipTheme() {
  const el = document.documentElement;
  const dark = el.dataset.theme ? el.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  el.dataset.theme = dark ? 'light' : 'dark';
}
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest('input,textarea,select,a')) return;
  const k = e.key;
  if (k === ' ') { e.preventDefault(); toggle(); }
  else if (k === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
  else if (k === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
  else if (k === 'Home') { e.preventDefault(); go(0); }
  else if (k === 'End') { e.preventDefault(); go(N - 1); }
  else if (k === '.' || k === ',') { const i = SPEEDS.indexOf(speed) + (k === '.' ? 1 : -1); speed = SPEEDS[Math.max(0, Math.min(SPEEDS.length - 1, i))]; paintControls(); }
  else if (k === 't' || k === 'T') flipTheme();
});

/* ---------- timeline ---------- */
const seqInner = $('seqInner');
const n = actors.length;
seqInner.style.minWidth = n * 132 + 'px';
const seqHead = h('div', 'seq-head', null, seqInner);
actors.forEach((a) => { h('div', '', a.label, seqHead).title = a.label + (a.sub ? ' · ' + a.sub : ''); });
const seqRows = h('div', 'seq-rows', null, seqInner);
const col = (id) => ((actors.findIndex((a) => a.id === id) + 0.5) / n) * 100;
actors.forEach((a) => { h('div', 'life', null, seqRows).style.left = col(a.id) + '%'; });
const rows = steps.map((s, i) => {
  const r = h('button', 'row' + (s.fail ? ' fail' : ''), null, seqRows);
  r.type = 'button';
  r.style.setProperty('--c', cvar(kindOf(s).color));
  r.setAttribute('aria-label', `Step ${i + 1}: ${s.title}`);
  h('span', 'num', String(i + 1), r);
  const x1 = col(s.from);
  if (s.to) {
    const x2 = col(s.to), full = Math.abs(x2 - x1), len = s.fail ? full * 0.56 : full, right = x2 > x1;
    const ar = h('span', 'arrow ' + (right ? 'r' : 'l'), null, r);
    ar.style.left = (right ? x1 : x1 - len) + '%';
    ar.style.width = len + '%';
    const lab = h('span', 'lab', s.label, ar);
    if (s.fail) lab.style.left = (right ? 50 / 0.56 : 100 - 50 / 0.56) + '%';
  } else {
    const box = h('span', 'self', null, r);
    box.dataset.col = x1;
    box.title = s.label;
    h('span', 'lab', s.label, box);
  }
  r.onclick = () => go(i);
  return r;
});
/** centre each "inside" box on its lifeline, pulled inward when it would run off either edge */
function layoutTimeline() {
  const W = seqRows.clientWidth;
  for (const box of seqRows.querySelectorAll('.self')) {
    const w = box.offsetWidth, c = (box.dataset.col / 100) * W;
    box.style.left = Math.max(26, Math.min(W - w - 6, c - w / 2)).toFixed(0) + 'px';
  }
}
function paintTimeline() {
  rows.forEach((r, i) => { r.classList.toggle('cur', i === cur); r.classList.toggle('past', i < cur); });
  const box = $('seqScroll'), r = rows[cur];
  const top = r.offsetTop + seqHead.offsetHeight;
  if (top < box.scrollTop + seqHead.offsetHeight || top + r.offsetHeight > box.scrollTop + box.clientHeight) {
    box.scrollTop = top - box.clientHeight / 2;
  }
  // on a narrow screen the columns scroll sideways: bring this step's actors into view
  const s = steps[cur], W = seqRows.clientWidth;
  const mid = ((col(s.from) + col(s.to || s.from)) / 200) * W;
  box.scrollLeft = Math.max(0, mid - box.clientWidth / 2);
}

/* ---------- inspector ---------- */
/** the same table one or more steps earlier, so cells that differ can be marked */
function previousTable(i, title) {
  for (let k = i - 1; k >= 0; k--) {
    const tb = (steps[k].state || []).find((x) => x.title === title);
    if (tb) return tb;
  }
  return null;
}
function paintInspector() {
  const s = steps[cur], k = kindOf(s), box = $('insp');
  box.textContent = '';
  box.style.setProperty('--c', colorOf(s));
  const top = h('div', 'insp-top', null, box);
  h('span', 'chip', (s.to ? '' : 'Inside · ') + k.label, top);
  h('span', 'route', `Step ${cur + 1} of ${N}`, top);
  h('h2', '', s.title, box);
  const route = h('div', 'route', null, box);
  h('b', '', byId[s.from].label, route);
  if (s.to) { h('span', 'ar', '→', route); h('b', '', byId[s.to].label, route); }
  else h('span', '', ' (nothing is sent)', route);
  if (s.fail) {
    const f = h('div', 'failbox', null, box);
    h('b', '', s.to ? 'Never arrives' : 'Refused here', f);
    h('span', '', s.fail === true ? 'This step fails.' : s.fail, f);
  }
  h('p', 'desc', s.desc, box);

  if (s.fields && s.fields.length) {
    const sec = h('section', '', null, box);
    h('h3', '', 'What is in play', sec);
    for (const g of s.fields) {
      const ge = h('div', 'group', null, sec);
      ge.style.setProperty('--c', cvar(g.color || k.color));
      h('div', 'group-name', g.group, ge);
      for (const [name, value, note] of g.rows || []) {
        const ch = (g.changed || []).includes(name);
        const f = h('div', 'field' + (ch ? ' changed' : ''), null, ge);
        h('span', 'k', name, f);
        const v = h('span', 'v', value, f);
        if (ch) h('span', 'tag', 'changed', v);
        if (note) h('span', 'note', note, f);
      }
    }
  }
  if (s.payload) {
    const sec = h('section', '', null, box);
    h('h3', '', 'Payload', sec);
    h('pre', 'payload', String(s.payload).replace(/\r\n/g, '\n'), sec);
  }
  if (s.state && s.state.length) {
    const sec = h('section', '', null, box);
    h('h3', '', 'State', sec);
    let any = false;
    for (const tb of s.state) {
      const prev = previousTable(cur, tb.title);
      const w = h('div', 'tbl-wrap', null, sec), table = h('table', '', null, w);
      h('caption', '', tb.title, table);
      const hr = h('tr', '', null, h('thead', '', null, table));
      (tb.head || []).forEach((x) => h('th', '', x, hr));
      const body = h('tbody', '', null, table);
      (tb.rows || []).forEach((r, ri) => {
        const tr = h('tr', (tb.mark || []).includes(ri) ? 'mark' : '', null, body);
        r.forEach((v, ci) => {
          const was = prev && prev.rows && prev.rows[ri] ? prev.rows[ri][ci] : undefined;
          const ch = prev && was !== v;
          if (ch) any = true;
          const td = h('td', ch ? 'changed' : '', v, tr);
          if (ch && was !== undefined && was !== '') td.title = 'Was: ' + was;
        });
      });
    }
    if (any) { const key = h('p', 'tbl-key', null, sec); h('i', '', null, key); key.appendChild(document.createTextNode('changed since this table was last shown')); }
  }
  if (s.notes && s.notes.length) {
    const sec = h('section', '', null, box);
    h('h3', '', 'Good to know', sec);
    const ul = h('ul', 'notes', null, sec);
    s.notes.forEach((x) => h('li', '', x, ul));
  }
  box.scrollTop = 0;
}

/* ---------- about: simplifications and sources ---------- */
const about = $('about');
const a1 = h('div', '', null, about);
h('h2', '', 'What this leaves out', a1);
const ul1 = h('ul', '', null, a1);
(spec.simplifications || []).forEach((x) => h('li', '', x, ul1));
const a2 = h('div', '', null, about);
h('h2', '', 'Sources', a2);
const ul2 = h('ul', '', null, a2);
(spec.sources || []).forEach((src) => {
  const li = h('li', '', null, ul2);
  if (/^https?:\/\//i.test(src.url || '')) {
    const a = h('a', '', src.title || src.url, li);
    a.href = src.url; a.rel = 'noopener noreferrer'; a.target = '_blank';
  } else li.textContent = src.title || '';
  if (src.note) li.appendChild(document.createTextNode(' — ' + src.note));
});
h('div', 'foot', 'A teaching model, not an emulator. Made with the visualize-anything skill.', about);

/* ---------- start ---------- */
const m = /step=(\d+)/.exec(location.hash);
addEventListener('resize', fit);
addEventListener('hashchange', () => { const x = /step=(\d+)/.exec(location.hash); if (x && +x[1] - 1 !== cur) go(+x[1] - 1, { silent: true }); });
fit();
go(m ? +m[1] - 1 : 0, { silent: true, instant: /static/.test(location.hash) });
window.__player = { go, toggle, get step() { return cur; }, get arrived() { return arrived; }, steps: N };
})();
</script>
</body>
</html>
